{% extends "base.html" %}

{% block content %}
  <div class="post-card" style="max-width: 500px;">
    <h2 class="mb-3">Delete post</h2>
    <p>Are you sure you want to delete "{{ post.content|truncatechars:50 }}"?</p>
    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Confirm</button>
      {% url 'feed:index' as fallback_url %}
      <a href="{{ request.META.HTTP_REFERER|default:fallback_url }}" class="btn btn-secondary">
        Cancel
      </a>
    </form>
  </div>
{% endblock %}
