{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <div class="post-card" style="max-width: 500px;">
    <h2 class="mb-3">Create post</h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="btn btn-primary w-100 mt-2">Save</button>
    </form>
  </div>
{% endblock %}
