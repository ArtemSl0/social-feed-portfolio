{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <div class="post-card" style="max-width: 400px;">
    <h2 class="mb-3">Login</h2>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
    </form>
  </div>
{% endblock %}
